<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RockAuto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="RockAuto Logo">
            ROCK<span>AUTO</span>
        </a>
        
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#vehicle-selector">Find Parts</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#part-search">Part Number Search</a>
            <a href="signin.html">Account</a>
        </div>
    </div>
</nav>

<section class="section auth-section">
    <div class="auth-box">
        
        <h2>Create Account</h2>
        <p>Join RockAuto for faster checkout and garages.</p>
       
        <form action="home.html">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter your full name">
            </div>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" required placeholder="Enter your email">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" required placeholder="Create a password">
            </div>
            
            <button type="submit" class="auth-button">Sign Up</button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="signin.html">Sign In here</a>.
        </p>

    </div>
</section>

<footer>
    <div class="footer-logo">
        ROCK<span>AUTO</span>
    </div>
    <p>Auto Parts Made Easier.</p>
    <p class="copyright">© 2026 RockAuto Redesign Concept. For educational purposes.</p>
</footer>

</body>
</html>
